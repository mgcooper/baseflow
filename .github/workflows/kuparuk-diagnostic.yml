name: Kuparuk conditioning comparison

# Run only the separately reviewed diagnostic branch, without product CI.
on:
  push:
    branches: [fix/bfra-kuparuk-conditioning-diagnostic-20261028]

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the diagnostic commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preserve public source and fixture identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kuparuk-stage-output"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/kuparuk-stage-output/git.txt"
          git ls-tree -r HEAD toolbox tests > "$RUNNER_TEMP/kuparuk-stage-output/source-blobs.txt"
          sha256sum toolbox/data/dailyflow.mat toolbox/data/annualdata.mat > "$RUNNER_TEMP/kuparuk-stage-output/fixture-sha256.txt"
      - name: Set up the same requested release and products
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: >-
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox
            Optimization_Toolbox
            Mapping_Toolbox
      - name: Capture the public Kuparuk chain once
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('tests/diagnostics');
            diagnoseKuparuk(pwd, fullfile(getenv('RUNNER_TEMP'),
            'kuparuk-stage-output'));
      - name: Retain observations even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kuparuk-stage-output
          path: ${{ runner.temp }}/kuparuk-stage-output
          retention-days: 14
