name: Tests

# note: paths are relative to top level, including actions/, matlab-actions/ etc.

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull requests for the specified branch
  # Note: the branch list must be comma-separated. A space-separated list
  # parses as one branch named "main dev" and the workflow never triggers.
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

  # Allows you to run this workflow manually from the Actions tab (default branch only)
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out repository
        uses: actions/checkout@v7
      
      # Sets up MATLAB on the GitHub Actions runner. The release matches the
      # version the suite is verified against locally. The products list
      # covers the toolboxes in the DESCRIPTION MatlabProducts line plus
      # the Optimization Toolbox.
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: >-
            Statistics_and_Machine_Learning_Toolbox
            Curve_Fitting_Toolbox
            Optimization_Toolbox
            Mapping_Toolbox

      # Build the suite from the tests folder. matlab-actions/run-tests
      # builds it with testsuite(pwd), which at the root of a MATLAB
      # project (bfra.prj) returns only project files labeled Test, so it
      # runs zero tests. The empty-suite assert keeps that failure visible.
      - name: Run tests and generate artifacts
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath('toolbox'); Setup('addpath');
            import matlab.unittest.TestRunner matlab.unittest.TestSuite
            matlab.unittest.plugins.XMLPlugin
            matlab.unittest.plugins.CodeCoveragePlugin
            matlab.unittest.plugins.codecoverage.CoberturaFormat;
            suite = TestSuite.fromFolder('tests');
            [~, ~] = mkdir('test-results');
            runner = TestRunner.withTextOutput;
            runner.addPlugin(XMLPlugin.producingJUnitFormat(
            fullfile('test-results', 'results.xml')));
            runner.addPlugin(CodeCoveragePlugin.forFolder('toolbox',
            'IncludingSubfolders', true, 'Producing',
            CoberturaFormat(fullfile('test-results', 'coverage.xml'))));
            results = runner.run(suite); display(results);
            assert(~isempty(results), 'The test suite is empty.');
            assertSuccess(results);

      # Publish the JUnit results and Cobertura coverage the previous step
      # produced. if: always() keeps the evidence for failing runs too.
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results

